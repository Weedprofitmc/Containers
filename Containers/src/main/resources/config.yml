prefix: '&6&lКонтейнеры &7| &f'

economy:
  currency: £
  refund-rate: 0.85
  bet-min: 1.0
  bet-max: 0.0
  bet-step: 1.0

anti-snipe:
  enabled: true
  threshold-ms: 30000
  extend-ms: 60000

dead-zone:
  enabled: false
  threshold-ms: 5000

hologram:
  enabled: true
  radius: 5.0
  height: 1.3
  fade-step: 25
  bar-filled: ▰
  bar-empty: ▱
  bar-segments: 10

sounds:
  radius: 20.0
  tick-threshold-ms: 10000
  bet:
    enabled: true
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    volume: 0.7
    pitch: 1.2
  tick:
    enabled: true
    sound: BLOCK_NOTE_BLOCK_HAT
    volume: 0.6
    pitch-normal: 1.4
    pitch-urgent: 1.8
    urgent-seconds: 3
  place:
    enabled: true
    sound: BLOCK_AMETHYST_BLOCK_CHIME
    volume: 0.7
    pitch: 1.4
  finish:
    enabled: true
    sound: BLOCK_AMETHYST_BLOCK_BREAK
    volume: 0.8
    pitch: 1.2

# ==================================================
#  АУКЦИОН (игроки создают лоты сами)
# ==================================================
auction:
  enabled: true
  max-lots-per-player: 2
  creation-fee-percent: 5.0
  sale-commission-percent: 10.0
  min-duration-ms: 300000
  max-duration-ms: 604800000
  min-start-price: 10.0
  allow-buyout: true

messages:
  help:
    header: '&6&l      Контейнеры &7v2.2.0'
    divider: '&8  ───────────────────────────────'
    line-info: '  &e▸ /cont info &7— список контейнеров'
    line-sell: '  &e▸ /cont sell &7— выставить лот на аукцион'
    line-send: '  &e▸ /cont send <id> <ставка> &7— поставить'
    line-log: '  &e▸ /cont log <id> &7— история ставок'
    line-top: '  &e▸ /cont top [wins|spent|won|lost] &7— топ игроков'
    admin-header: '  &aАдмин:'
    admin-create: '  &e▸ /cont create <id> <название> <время>'
    admin-spawner: '  &e▸ /cont spawner <id> <название> <время>'
    admin-edit: '  &e▸ /cont edit/end/remove/cancel <id>'
